name: Next.js CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: mysql://user:password@127.0.0.1:3306/propverse
      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: mysql://user:password@127.0.0.1:3306/propverse
